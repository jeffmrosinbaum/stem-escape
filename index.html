<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STEM Escape">
<meta name="theme-color" content="#3a86ff">
<link rel="apple-touch-icon" href="art/icon-180.png">
<link rel="icon" href="art/icon-180.png">
<title>STEM Lab Escape Challenge</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="mapBtn" type="button" aria-label="Map" hidden>🗺️</button>
  <div class="brand" id="brand" title="Press and hold for Teacher mode">STEM Lab <span>Escape Challenge</span></div>
  <div class="timer" id="timer" aria-live="off"></div>
  <div id="sendBadge" class="sendbadge" hidden></div>
  <button class="restart" id="restartBtn" type="button" aria-label="Start over (press and hold)" title="Press and hold to start over"><span class="ring" aria-hidden="true"></span><span class="rl">↺ Start over</span></button>
</header>
<div id="warn" class="warn" hidden></div>
<main id="app" tabindex="-1"></main>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>Please turn on JavaScript to play the STEM Lab Escape Challenge.</noscript>
<script src="js/config.js"></script>
<script src="data/challenges.js"></script>
<script src="js/core.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/store.js"></script>
<script src="js/send.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/camera.js"></script>
<script src="js/app.js"></script>
</body>
</html>
